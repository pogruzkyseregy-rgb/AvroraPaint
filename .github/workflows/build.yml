name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon 2>&1 | tee build.log

      - name: Show compile errors
        if: failure()
        run: |
          grep -E "^e: |What went wrong" -A2 build.log || true

      - name: Show built APK files
        run: find app/build/outputs -name "*.apk" || true

      - uses: actions/upload-artifact@v4
        with:
          name: avrora-paint-debug
          path: app/build/outputs/apk/debug/
          if-no-files-found: error
